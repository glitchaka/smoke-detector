name: Import promptemon core

on:
  push:
    paths:
      - '.github/workflows/import-promptemon-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout smoke-detector
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch promptemon-steidium snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/glitchaka/promptemon-steidium.git upstream
          mkdir -p src tools docs roms
          cp upstream/CMakeLists.txt ./CMakeLists.txt
          cp upstream/build.cmd ./build.cmd
          cp -R upstream/src/rom ./src/
          cp -R upstream/src/bch ./src/
          cp -R upstream/src/demo ./src/
          if [ -d upstream/src/pokemon ]; then cp -R upstream/src/pokemon ./src/; fi
          if [ -d upstream/src/viewer ]; then cp -R upstream/src/viewer ./src/; fi
          if [ -d upstream/tools ]; then cp -R upstream/tools/. ./tools/; fi
          if [ -d upstream/docs ]; then cp -R upstream/docs/. ./docs/; fi
          if [ -f upstream/roms/README.md ]; then cp upstream/roms/README.md ./roms/README.md; fi
          rm -rf upstream

      - name: Keep ROMs and exports local
        shell: bash
        run: |
          cat > .gitignore <<'EOF'
          build/
          exports/
          roms/*
          !roms/README.md
          *.cia
          *.3ds
          *.cci
          *.cxi
          *.nds
          *.gba
          *.gbc
          *.gb
          EOF

      - name: Commit imported snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt build.cmd .gitignore src tools docs roms
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import promptemon ROM viewer core"
          git push
